apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: employee-api
  template:
    metadata:
      labels:
        app: employee-api
    spec:
      containers:
      - name: employee-api
        image: 799517508141.dkr.ecr.us-east-1.amazonaws.com/employee-api:latest
        ports:
        - containerPort: 8080
